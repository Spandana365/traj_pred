[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trackvision"
version = "0.1.0"
description = "Controlled study of error propagation from multi-object tracking into pedestrian trajectory prediction."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8", "matplotlib>=3.8,<4", "httpx>=0.27,<1"]
api = ["fastapi>=0.104,<1", "pydantic>=2,<3", "uvicorn[standard]>=0.24,<1"]
prediction = ["torch>=2.2,<3"]
localization-noise = ["torch>=2.2,<3", "matplotlib>=3.8,<4"]
detection-dropout = ["torch>=2.2,<3", "matplotlib>=3.8,<4"]
track-fragmentation = ["torch>=2.2,<3", "matplotlib>=3.8,<4"]
identity-switch = ["torch>=2.2,<3", "matplotlib>=3.8,<4"]

[project.scripts]
trackvision = "trackvision.cli:main"
trackvision-predict = "trackvision.prediction.experiment:main"
trackvision-localization-noise = "trackvision.prediction.localization_noise:main"
trackvision-detection-dropout = "trackvision.prediction.detection_dropout:main"
trackvision-track-fragmentation = "trackvision.prediction.track_fragmentation:main"
trackvision-identity-switch = "trackvision.prediction.identity_switch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "src"]
addopts = "-ra --strict-markers"
markers = [
    "phase1: reserved for Implementation Plan 'Phase 1 - Data and scene geometry'",
    "phase2: reserved for Implementation Plan 'Phase 2 - Predictors and the clean baseline'",
]
